# Câmara Aberta — rodada diária automática.
# Atualiza pela API só o que mudou, regera os JSON, versiona os dados e publica o site.
# Se qualquer checagem de sanidade falhar, o passo sai com erro, nada é commitado nem
# publicado, e o site continua com os dados do dia anterior.

name: Atualização diária

on:
  schedule:
    - cron: "30 9 * * *"   # 6h30 em Brasília. O cron do GitHub é em UTC e pode atrasar.
  workflow_dispatch:        # botão "Run workflow", para rodar na mão

permissions:
  contents: write   # commit dos dados
  pages: write      # publicação
  id-token: write

concurrency:
  group: atualizacao-diaria
  cancel-in-progress: false

jobs:
  rotina_critica:
    name: Rotina crítica
    runs-on: ubuntu-latest
    timeout-minutes: 240
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    env:
      CACHE_PREFIX: cache-api-ubuntu-${{ github.ref_name }}-v1
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Restaurar o cache da API
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: ${{ env.CACHE_PREFIX }}
          restore-keys: |
            ${{ env.CACHE_PREFIX }}-
            cache-api-ubuntu-

      - name: Executar rotina crítica
        run: python scripts/rodada.py --grupo critico

      - name: Validar JSONs públicos
        run: python scripts/validar_jsons.py

      - name: Guardar o cache (depois da coleta crítica)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache
          key: ${{ env.CACHE_PREFIX }}

      - name: Versionar os dados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add site/dados entradas site/deputado site/senador site/sitemap.xml site/robots.txt site/img site/*.html
          if git diff --cached --quiet; then echo "Sem mudança nos dados."; exit 0; fi
          git commit -q -m "Dados de $(date +%F)"
          R="${GITHUB_REF_NAME}"
          for i in 1 2 3; do
            if git pull -q --rebase -X theirs origin "$R"; then
              git push -q origin "HEAD:$R" && exit 0
            else
              git rebase --abort 2>/dev/null || true
            fi
            echo "::warning title=Versionar os dados::envio para $R recusado (tentativa $i de 3); tentando de novo"
            sleep 15
          done
          echo "::error title=Versionar os dados::não consegui enviar os dados para $R depois de 3 tentativas"
          exit 1

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: publicar
        uses: actions/deploy-pages@v4

  dados_pesados:
    name: Coleta pesada (opcional)
    needs: rotina_critica
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      CACHE_PREFIX: cache-api-ubuntu-${{ github.ref_name }}-v1
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Restaurar o cache da API
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: ${{ env.CACHE_PREFIX }}
          restore-keys: |
            ${{ env.CACHE_PREFIX }}-
            cache-api-ubuntu-

      - name: Executar coleta pesada
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/rodada.py --grupo pesado

      - name: Guardar o cache para a próxima rodada
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache
          key: ${{ env.CACHE_PREFIX }}
