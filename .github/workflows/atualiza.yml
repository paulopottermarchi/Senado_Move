# Câmara Aberta — rodada diária automática.
# Atualiza pela API só o que mudou, regera os JSON, versiona os dados e publica o site.
# Se qualquer checagem de sanidade falhar, o passo sai com erro, nada é commitado nem
# publicado, e o site continua com os dados do dia anterior.

name: Atualização diária

on:
  schedule:
    - cron: "30 9 * * *"   # 6h30 em Brasília. O cron do GitHub é em UTC e pode atrasar.
  workflow_dispatch:        # botão "Run workflow", para rodar na mão

permissions:
  contents: read

concurrency:
  group: atualizacao-diaria
  cancel-in-progress: false

jobs:
  atualizar_publicar:
    name: Atualizar e publicar
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    env:
      CACHE_PREFIX: cache-api-ubuntu-${{ github.ref_name }}-v1
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Orçamento dos passos OPCIONAIS (passo.py lê RODADA_FIM): 320 min a partir daqui. O job tem 360; os ~40 que sobram são do
      # cache, da restauração, da validação, do commit e da publicação, que assim sempre rodam. Em 25/10/2026 um opcional levou 317 min,
      # o job foi cortado no limite e nada foi publicado. Os obrigatórios (até "Esta semana") não entram no orçamento: falhou um, não há
      # publicação de qualquer jeito.
      - name: Orçamento da rodada
        run: echo "RODADA_FIM=$(( $(date +%s) + 320 * 60 ))" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Restaurar o cache da API
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: ${{ env.CACHE_PREFIX }}-${{ github.run_id }}
          restore-keys: |
            ${{ env.CACHE_PREFIX }}-
            cache-api-ubuntu-

      - name: Atualizar pela API (só o que mudou)
        run: python scripts/passo.py atualiza.py

      - name: Regerar deputados.json
        run: python scripts/passo.py coleta.py --limite 513

      - name: Votos (arquivos em lote do ano corrente)
        run: python scripts/passo.py votos.py --atualizar

      - name: Blocos de voto
        run: python scripts/passo.py blocos.py --atualizar

      - name: Temas e frase-resumo
        run: python scripts/passo.py temas.py

      - name: Esta semana na Câmara
        run: python scripts/passo.py semana.py

      # Blocos pesados e não críticos para a publicação do site do dia, mas úteis para enriquecer os dados.
      - name: Notoriedade das leis
        continue-on-error: true
        timeout-minutes: 25
        run: python scripts/passo.py --opcional notoriedade.py

      - name: Notoriedade dos deputados (Wikipédia)
        continue-on-error: true
        timeout-minutes: 25
        run: python scripts/passo.py --opcional wikipedia.py

      - name: Notícias da Agência Câmara
        continue-on-error: true
        timeout-minutes: 25
        run: python scripts/passo.py --opcional noticias.py

      - name: Canais oficiais no YouTube
        continue-on-error: true
        timeout-minutes: 25
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/passo.py --opcional youtube.py

      - name: Enquetes da Câmara
        continue-on-error: true
        timeout-minutes: 25
        run: python scripts/passo.py --opcional enquetes.py

      - name: Consulta pública do Senado
        # teto 25 min: 13 min com o cache zerado
        continue-on-error: true
        timeout-minutes: 30
        run: python scripts/passo.py --opcional --minutos 25 ecidadania.py

      - name: Contexto econômico (coleta)
        # teto 50 min: 39 min no pior dia, 25 no típico
        continue-on-error: true
        timeout-minutes: 55
        run: python scripts/passo.py --opcional --minutos 50 contexto.py

      - name: Resumos (IA, a partir do inteiro teor)
        # teto 20 min: 8 min com o cache zerado; o lote fica registrado antes de esperar e é coletado na rodada seguinte
        continue-on-error: true
        timeout-minutes: 25
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/passo.py --opcional --minutos 20 resumos.py --escopo leis,recentes,contexto --limite 200 --esperar 15

      - name: Objetivos declarados (IA, citação literal)
        # teto 20 min: 7 min com o cache zerado; idem
        continue-on-error: true
        timeout-minutes: 25
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/passo.py --opcional --minutos 20 objetivos.py --limite 250 --esperar 15

      - name: Contexto econômico (montar com resumos e objetivos)
        continue-on-error: true
        timeout-minutes: 25
        run: python scripts/passo.py --opcional contexto.py --so-montar

      - name: Exportações e balança comercial (Comex Stat)
        # teto 45 min: a frio, ~40 min nesta máquina; hoje ~3 min
        continue-on-error: true
        timeout-minutes: 50
        run: python scripts/passo.py --opcional --minutos 45 comex.py

      - name: Tributos (Receita Federal)
        continue-on-error: true
        timeout-minutes: 25
        run: python scripts/passo.py --opcional receita.py

      - name: Obras e contratos
        # teto 40 min: 29 min no pior dia
        continue-on-error: true
        timeout-minutes: 45
        run: python scripts/passo.py --opcional --minutos 40 obras.py

      - name: Pessoas documentadas das obras
        # teto 55 min: 79 min com o cache zerado e 317 em 25/10; o teto interno é --minutos 45
        continue-on-error: true
        timeout-minutes: 60
        run: python scripts/passo.py --opcional --minutos 55 pessoas.py --publicar --vias e2,e8 --minutos 45

      # depois de obras.py (as obras de obras.html) e de coleta.py (deputados e mandatos); falhou, site/dados/emendas/ fica como estava.
      # As listas do ObrasGov valem 7 dias: nos outros dias o passo leva segundos; no 7º, ou com o cache vazio, ~12 min (medido). --minutos é o teto.
      # SEM --publicar até a conferência à mão de uma amostra dos vínculos (decidido em 7/11/2026): o passo roda e grava só em
      # cache/emendas/ (candidato, auditoria, relatório), para medir a coleta no runner. Para publicar, trocar --dry-run por --publicar.
      - name: Emendas de deputados nas obras
        # teto 45 min: 12 min com o cache zerado; teto interno --minutos 40
        continue-on-error: true
        timeout-minutes: 50
        run: python scripts/passo.py --opcional --minutos 45 emendas_obras.py --dry-run --minutos 40

      - name: Senadores
        # teto 60 min: 50 min com o cache zerado
        continue-on-error: true
        timeout-minutes: 65
        run: python scripts/passo.py --opcional --minutos 60 senado.py

      - name: Tramitações
        # teto 30 min: 20 min todo dia (--limite 12000)
        continue-on-error: true
        timeout-minutes: 35
        run: python scripts/passo.py --opcional --minutos 30 tramitacoes.py --limite 12000

      - name: Página de cada senador
        continue-on-error: true
        timeout-minutes: 25
        run: python scripts/passo.py --opcional senador_paginas.py

      - name: Blocos de voto do Senado
        continue-on-error: true
        timeout-minutes: 25
        run: python scripts/passo.py --opcional blocos_senado.py

      - name: Partidos
        continue-on-error: true
        timeout-minutes: 25
        run: python scripts/passo.py --opcional partidos.py

      - name: Alinhamento ao Governo por governo
        continue-on-error: true
        timeout-minutes: 25
        run: python scripts/passo.py --opcional governo.py

      - name: Logos dos partidos
        continue-on-error: true
        timeout-minutes: 25
        run: python scripts/passo.py --opcional logos.py

      - name: Fluxo entre as casas
        # teto 70 min: 62 min com o cache zerado, 31 no típico
        continue-on-error: true
        timeout-minutes: 75
        run: python scripts/passo.py --opcional --minutos 70 fluxo.py --limite 9000

      - name: De onde vêm as leis
        continue-on-error: true
        timeout-minutes: 25
        run: python scripts/passo.py --opcional origem_leis.py

      - name: Páginas indexáveis e sitemap
        continue-on-error: true
        timeout-minutes: 25
        run: python scripts/passo.py --opcional paginas.py

      - name: Guardar o cache para a próxima rodada
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache
          key: ${{ env.CACHE_PREFIX }}-${{ github.run_id }}

      # Um passo cortado (teto, orçamento, timeout-minutes) pode ter deixado um temporário ou, num script que não grava de forma
      # atômica, um arquivo pela metade. Antes de validar, versionar e publicar (o Pages sobe a PASTA site/, não o commit): temporários
      # e pastas de troca apagados, e o que não estiver inteiro volta ao do último commit.
      - name: Desfazer o que um passo cortado deixou pela metade
        run: python scripts/restaurar_parciais.py

      - name: Validar JSONs públicos
        run: python scripts/validar_jsons.py --report

      - name: Validar JSONs reais contra os schemas
        run: python scripts/validar_jsons_reais.py

      - name: Versionar os dados e o site gerado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          # -A: arquivo que a rodada apagou (ex.: deputado que perdeu o último vínculo em site/dados/emendas/) sai do repositório também
          git add -A site entradas
          if git diff --cached --quiet; then echo "Sem mudança nos dados."; exit 0; fi
          git commit -q -m "Dados de $(date +%F)"
          R="${GITHUB_REF_NAME}"
          for i in 1 2 3; do
            if git pull -q --rebase -X theirs origin "$R"; then
              git push -q origin "HEAD:$R" && exit 0
            else
              git rebase --abort 2>/dev/null || true
            fi
            echo "::warning title=Versionar os dados::envio para $R recusado (tentativa $i de 3); tentando de novo"
            sleep 15
          done
          echo "::error title=Versionar os dados::não consegui enviar os dados para $R depois de 3 tentativas"
          exit 1

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: publicar
        uses: actions/deploy-pages@v4
