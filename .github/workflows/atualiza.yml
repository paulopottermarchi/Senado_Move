# Câmara Aberta — rodada diária automática.
# Atualiza pela API só o que mudou, regera os JSON, versiona os dados e publica o site.
# Se qualquer checagem de sanidade falhar, o passo sai com erro, nada é commitado nem
# publicado, e o site continua com os dados do dia anterior.

name: Atualização diária

on:
  schedule:
    - cron: "30 9 * * *"   # 6h30 em Brasília. O cron do GitHub é em UTC e pode atrasar.
  workflow_dispatch:        # botão "Run workflow", para rodar na mão

permissions:
  contents: write   # commit dos dados
  pages: write      # publicação
  id-token: write

concurrency:
  group: atualizacao-diaria
  cancel-in-progress: false

jobs:
  atualizar:
    # Windows, como a máquina de desenvolvimento. (O motivo antigo — "a Câmara não envia o
    # certificado intermediário" — era o antivírus daquela máquina; o teste de conexão de 30/9/2026
    # alcançou todas as APIs também no Linux.) Nunca verify=False.
    # Cada passo roda por scripts/passo.py: se falhar, o motivo vira anotação no resumo da rodada.
    runs-on: windows-latest
    timeout-minutes: 350    # a primeira rodada, sem cache, refaz a coleta inteira (~3 h)
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip install -r requirements.txt

      # O cache/ (~670 MB) não vai para o git. Sobrevive entre rodadas no cache do
      # Actions: cada rodada restaura a última e salva uma nova.
      - name: Restaurar o cache da API
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: cache-api-${{ github.run_id }}
          restore-keys: cache-api-

      - name: Atualizar pela API (só o que mudou)
        run: python scripts/passo.py atualiza.py

      - name: Regerar deputados.json
        run: python scripts/passo.py coleta.py --limite 513

      # Com o cache vazio (1ª rodada, ou cache despejado) a coleta leva ~3 h e a rodada inteira
      # chega perto do limite de 350 min. Guardar aqui garante que essas horas não se percam se a
      # rodada estourar o tempo ou falhar adiante; a próxima restaura o cache mais recente.
      - name: Guardar o cache (depois da coleta)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache
          key: cache-api-${{ github.run_id }}-coleta

      - name: Votos (arquivos em lote do ano corrente)
        run: python scripts/passo.py votos.py --atualizar

      # Quem vota com quem: blocos por semelhança de voto e orientação do Governo, dos mesmos
      # arquivos em lote (só rebaixa as orientações do ano corrente). Sem API.
      - name: Blocos de voto
        run: python scripts/passo.py blocos.py --atualizar

      # Notoriedade na Câmara de cada lei votada: apensados, votações nominais, placar,
      # urgência e assinaturas de PEC (índice com componentes sempre visíveis). API, com cache.
      - name: Notoriedade das leis
        run: python scripts/passo.py --opcional notoriedade.py

      # Notoriedade dos deputados: leituras do artigo na Wikipédia (90 dias). Liga deputado →
      # artigo só por identificador; religa quando entra deputado novo.
      - name: Notoriedade dos deputados (Wikipédia)
        run: python scripts/passo.py --opcional wikipedia.py

      # Notícias da Agência Câmara sobre PEC e PL (RSS), ligadas pelo link da notícia para a
      # ficha. Confere a regra de reprodução no rodapé de cada notícia.
      - name: Notícias da Agência Câmara
        run: python scripts/passo.py --opcional noticias.py

      # Canal oficial de cada deputado no YouTube: inscritos como o YouTube informa (sem
      # ranking nem soma). Com o segredo YOUTUBE_API_KEY; sem ele, só os links.
      - name: Canais oficiais no YouTube
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/passo.py --opcional youtube.py

      # Enquete de cada lei votada, na página de resultado do site da Câmara (não há API).
      # Só as abertas e as novas são consultadas de novo. Falha de rede não para a rodada;
      # página em formato inesperado sai com erro e o enquetes.json do dia anterior fica.
      - name: Enquetes da Câmara
        run: python scripts/passo.py --opcional enquetes.py

      # Consulta pública do Senado (e-Cidadania), ligada pelo número único Câmara–Senado e
      # confirmada nos Dados Abertos do Senado. Mesma regra: falha não para a rodada.
      - name: Consulta pública do Senado
        run: python scripts/passo.py --opcional ecidadania.py

      # Passo 8: resumo de cada PL e PEC a partir do texto integral, por IA, em lote.
      # Só gera com o segredo ANTHROPIC_API_KEY cadastrado no repositório; sem ele, apenas
      # aplica os resumos já existentes. Espera até 60 min; o que não terminar é coletado
      # na rodada seguinte (nunca reenviado). Falha não para a rodada.
      - name: Resumos (IA, a partir do inteiro teor)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/passo.py --opcional resumos.py --esperar 60

      # Obras com contrato federal (ObrasGov + Contratos.gov.br + emendas da CGU), só SP por ora.
      # APIs públicas sem chave, uma requisição por segundo; contratos relidos a cada 7 dias.
      # Falha não para a rodada: obras.json fica como estava.
      - name: Obras e contratos
        run: python scripts/passo.py --opcional obras.py

      # Senadores (Dados Abertos do Senado, sem chave): autoria, leis, relatorias e votos.
      - name: Senadores
        run: python scripts/passo.py --opcional senado.py

      # Histórico de tramitação (quanto tempo e por onde passou), uma chamada por proposição.
      # Rebaixa só as que andaram; com o cache vazio, no máximo 12 mil por rodada (~1 h).
      - name: Tramitações
        run: python scripts/passo.py --opcional tramitacoes.py --limite 12000

      - name: Temas e frase-resumo
        run: python scripts/passo.py temas.py

      # Aba "Partidos": proposições por partido, por legislatura desde 1991 e por tema, dos arquivos anuais
      # em lote da Câmara (a 1ª rodada baixa ~700 MB; as seguintes só relêem o que mudou). Usa o
      # deputados.json já com os votos, o blocos.json e a coesão que o votos.py deixou no cache.
      # Falha não para a rodada (a aba só some).
      - name: Partidos
        run: python scripts/passo.py --opcional partidos.py

      # Alinhamento dos partidos ao Governo, governo a governo (2003 em diante). Usa os arquivos de votação em lote
      # (os de 2003–2022 só na 1ª rodada: ~480 MB, apagados depois de derivados) e confere o resultado com o
      # blocos.json. Falha não para a rodada (o quadro e a coluna só somem).
      - name: Alinhamento ao Governo por governo
        run: python scripts/passo.py --opcional governo.py

      # Logos dos partidos (Câmara, ou Wikimedia Commons pela tabela curada entradas/logos_partidos.json).
      # Só referencia endereços; não guarda imagem. Depois de "Partidos", que dá as siglas. Falha não para a rodada.
      - name: Logos dos partidos
        run: python scripts/passo.py --opcional logos.py

      # Onde a proposta morre entre as casas: proposições aprovadas numa casa e remetidas à outra (Senado /processo +
      # tramitações da Câmara), por vínculo de identificador exato. A coleta a frio (~24 mil processos do Senado e ~23 mil
      # tramitações da Câmara) leva horas: com --limite ela se completa em alguns dias, e o fluxo.json só é regravado
      # quando o conjunto está completo e as checagens passam. Depois, só o que o Senado diz ter mudado (numdias).
      # Falha não para a rodada (a página só fica sem dados novos).
      - name: Fluxo entre as casas
        run: python scripts/passo.py --opcional fluxo.py --limite 9000

      - name: Esta semana na Câmara
        run: python scripts/passo.py semana.py

      # Salva mesmo se algo falhou: o que foi baixado não precisa ser baixado de novo.
      - name: Guardar o cache para a próxima rodada
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache
          key: cache-api-${{ github.run_id }}

      # O histórico dos dados fica no git: é o registro auditável do que mudou e quando.
      # temas.py só reescreve o arquivo de deputado que mudou, então o commit é pequeno.
      # site/dados/ = o que as páginas leem; entradas/ = resumos por IA e tabelas fixas.
      - name: Versionar os dados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add site/dados entradas
          if git diff --cached --quiet; then echo "Sem mudança nos dados."; exit 0; fi
          git commit -q -m "Dados de $(date +%F)"
          # A rodada leva de minutos a horas: se a main andou nesse meio-tempo (um PR aceito), o
          # push direto é recusado — foi o que derrubou a rodada de 30/9/2026, depois de 4h40 de
          # coleta. Reaplica o commit de dados sobre a main nova; num conflito em site/dados/ ou
          # entradas/, vale o dado desta rodada (o mais recente). PR de código não traz dados.
          R="${GITHUB_REF_NAME}"
          for i in 1 2 3; do
            if git pull -q --rebase -X theirs origin "$R"; then
              git push -q origin "HEAD:$R" && exit 0
            else
              git rebase --abort 2>/dev/null || true
            fi
            echo "::warning title=Versionar os dados::envio para $R recusado (tentativa $i de 3); tentando de novo"
            sleep 15
          done
          echo "::error title=Versionar os dados::não consegui enviar os dados para $R depois de 3 tentativas"
          exit 1

      # site/ é exatamente o que vai ao ar: páginas, estilo, ícone e site/dados/. Nada de
      # cache/, scripts/ ou entradas/ é publicado.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: publicar
        uses: actions/deploy-pages@v4
